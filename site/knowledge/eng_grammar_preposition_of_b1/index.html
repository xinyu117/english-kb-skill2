  <script>
    window.KB_DETAIL = {"generatedAt":"2026-10-19T07:45:43.595Z","id":"eng_grammar_preposition_of_b1","point":{"id":"eng_grammar_preposition_of_b1","log":{"ts":"2026-10-19T16:20:13+09:00","action":"CREATED","artifactType":"KNOWLEDGE_POINT","id":"eng_grammar_preposition_of_b1","file":"base/eng_grammar_preposition_of_b1.json","request":"Create a B1 knowledge point for the common uses of of","userPrompt":"$english-kb of的用法","validation":"PASS","createdAt":"2026-10-19T16:19:34.3047876+09:00","category":"GRAMMAR","subcategory":"PREPOSITION","difficulty":"B1"},"content":{"id":"eng_grammar_preposition_of_b1","category":"GRAMMAR","subcategory":"PREPOSITION","difficulty":"B1","targetAgeMin":12,"targetAgeMax":18,"targetAgeGroup":"teen","tags":["preposition","of","possession","part and whole","quantity","material","collocation","noun phrase"],"definition":{"name":"介词 of 的常见用法","description":"of 是最常用的英语介词之一，核心作用是连接名词或名词短语，表达所属或关联、整体与部分、数量或群体、构成或材料、来源、主题等关系。它后面通常接名词或名词短语；代词作宾语时用宾格（如 one of us），也可接动名词（如 afraid of failing）。of 没有单一固定的中文译法，需要根据前后词的关系或固定搭配判断含义。"},"examples":[{"english":"The name of the school is Green Hill.","translation":"这所学校的名字是 Green Hill。","note":"表示名称与学校之间的所属或关联关系。"},{"english":"The roof of the old house needs repair.","translation":"那座老房子的屋顶需要修缮。","note":"表示整体（the old house）与部分（the roof）的关系。"},{"english":"She bought a cup of tea.","translation":"她买了一杯茶。","note":"表示数量或计量单位：a cup of tea。"},{"english":"One of my friends lives in Tokyo.","translation":"我的一个朋友住在东京。","note":"one of + 复数名词表示“……之一”，谓语与 one 保持一致。"},{"english":"The table is made of wood.","translation":"这张桌子是用木头做的。","note":"be made of 表示成品仍能看出原材料，是常见固定搭配。"},{"english":"Have you heard of this singer?","translation":"你听说过这位歌手吗？","note":"hear of 表示“听说、知道……的存在”，属于固定搭配。"},{"english":"She is afraid of making mistakes.","translation":"她害怕犯错。","note":"形容词 afraid 后接 of，of 后可使用动名词 making。"},{"english":"The story explores the power of friendship.","translation":"这个故事探讨了友谊的力量。","note":"表示两个抽象概念之间的联系：friendship 所具有的力量。"}],"expressions":[{"expression":"the name of the school / the color of the wall","meaning":"表示事物之间的所属、名称或特征关联","register":"neutral","scenario":"介绍人物、地点或描述事物特征"},{"expression":"the roof of the house / the end of the film","meaning":"表示整体与部分，或整体中的某个位置、阶段","register":"neutral","scenario":"描述物体结构或事件进程"},{"expression":"a cup of tea / two pieces of paper / a group of students","meaning":"表示数量、单位或一组人或事物","register":"neutral","scenario":"说明数量、容器、单位或群体"},{"expression":"be made of wood / a dress of silk","meaning":"表示物品由某种材料或成分构成","register":"neutral","scenario":"说明物品的材料或组成"},{"expression":"one of my friends / some of them","meaning":"表示某个或某些成员属于一个更大的群体","register":"neutral","scenario":"从特定群体中选出一个或一部分"},{"expression":"be afraid of / think of / hear of","meaning":"构成形容词、动词与 of 的常见固定搭配","register":"neutral","scenario":"表达感受、思考或获知信息"}],"relatedTopics":["eng_grammar_possession_of_s_b1","eng_grammar_prepositions_at_on_in_b1"],"source":null,"createdAt":"2026-10-19T16:19:34.3047876+09:00","updatedAt":null},"hasContent":true,"learningAssetCount":12,"assetStrategies":["CLASSIFICATION","COMPARISON","ASSOCIATION","EXAMPLE","COUNTER_EXAMPLE","PRODUCTION","EXPLANATION","SCENARIO","DIALOGUE","MNEMONIC","CONFUSION","EXTENSION"]},"assets":[{"id":"asset_eng_grammar_preposition_of_b1_classification","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"CLASSIFICATION","title":"Preposition inside a noun phrase","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"classification":{"parent":"Prepositions in noun phrases","reason":"of 属于介词，通常在名词短语内部建立两个名词性成分之间的关系。它不应只按某一个中文义项记忆，而要根据所属、部分、数量、材料或固定搭配等结构关系判断。"}},{"id":"asset_eng_grammar_preposition_of_b1_comparison","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"COMPARISON","title":"of and possessive 's","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"comparison":{"compareWith":"of and 's","similarities":["两者都能连接两个名词性成分，表达所属或密切关联。","在部分语境中，两者可以表达相近的人与物、物与物之间的关系。"],"differences":["of 通常放在被说明的名词之后，如 the roof of the house；'s 通常放在所有者之后，如 the house's roof。","简短的人或动物所有者更常用 's；事物、部分、抽象概念和较长名词短语更常用 of。","并非所有由 of 表达的关系都能自然改写成 's，固定搭配尤其不能机械替换。"]}},{"id":"asset_eng_grammar_preposition_of_b1_association","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"ASSOCIATION","title":"Useful of-phrases","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"association":{"relatedTopics":["eng_grammar_possession_of_s_b1","eng_grammar_prepositions_at_on_in_b1"],"relatedWords":["the name of the street","a piece of cake","two bottles of water","a member of the team","be made of glass","a photo of my family","think of an idea","be afraid of spiders"],"note":"建议按“所属、整体与部分、数量与群体、材料、固定搭配”分组记忆，并同时关注 of 后接的是名词、宾格代词还是动名词。"}},{"id":"asset_eng_grammar_preposition_of_b1_example","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"EXAMPLE","title":"One member of a group","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"example":{"english":"A member of our class designed the poster.","translation":"我们班的一名成员设计了这张海报。","note":"a member of our class 表示“我们班成员中的一个”，of 连接个体与所属群体；翻译时不必机械地译成“……的”。"}},{"id":"asset_eng_grammar_preposition_of_b1_counter_example","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"COUNTER_EXAMPLE","title":"Wrong preposition after afraid","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"counterExample":{"wrong":"She is afraid from making mistakes.","reason":"表示“害怕……”的固定搭配是 be afraid of，不是 be afraid from。of 是介词，后面接动名词 making。正确说法是：She is afraid of making mistakes."}},{"id":"asset_eng_grammar_preposition_of_b1_production","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"PRODUCTION","title":"Production prompt","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"production":{"mySentence":"请围绕一次班级活动写 5 个英文句子：一处所属或关联、一处整体与部分、一处数量或群体、一处材料或构成，以及一个含 of 的固定搭配。","feedback":"逐句检查 of 前后是什么关系，以及 of 后接的是否为名词短语、宾格代词或动名词；同时确认固定搭配没有被替换成其他介词。"}},{"id":"asset_eng_grammar_preposition_of_b1_explanation","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"EXPLANATION","title":"Understand the relationship, not just the translation","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"explanation":{"myUnderstanding":"理解 of 时，先问它前后两个成分是什么关系，再决定中文含义。the name of the school 表示名称与学校的关联；the roof of the house 表示整体与部分；a cup of tea 表示数量或单位；one of my friends 表示群体中的一员；be made of wood 表示材料；be afraid of 则是固定搭配。of 是介词，后面通常接名词短语，代词要用宾格，如 one of us，动词则常用动名词，如 afraid of failing。"}},{"id":"asset_eng_grammar_preposition_of_b1_scenario","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"SCENARIO","title":"Introducing a family photo","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"scenario":{"description":"你正在向一位交换生介绍家庭照片。你可以说：This is a photo of my family. The house in the middle of the picture is my grandparents' home. One of the windows is open, and the roof of the house needs repair. 介绍时尝试说明每处 of 连接的是哪两个成分，以及它们在表达什么关系。"}},{"id":"asset_eng_grammar_preposition_of_b1_dialogue","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"DIALOGUE","title":"Talking about an old house","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"dialogue":{"conversation":[{"speaker":"Maya","text":"What's that photo on your desk?"},{"speaker":"Ben","text":"It's a photo of my grandparents' old house."},{"speaker":"Maya","text":"The roof of the house looks old."},{"speaker":"Ben","text":"Yes, and one of the windows is broken."},{"speaker":"Maya","text":"Are they planning to fix it?"},{"speaker":"Ben","text":"They are thinking of selling it, but they haven't decided."}]}},{"id":"asset_eng_grammar_preposition_of_b1_mnemonic","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"MNEMONIC","title":"Ask what the two sides share","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"mnemonic":{"method":"关系分类法","content":"看到 of，先问“前后是什么关系？”再判断：是谁的、哪一部分、多少或哪一批、什么材料，还是固定搭配。口诀是：of 不只会翻成“的”，先找关系再翻译。"}},{"id":"asset_eng_grammar_preposition_of_b1_confusion","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"CONFUSION","title":"made of and made from","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"confusion":{"confusedWith":"be made of and be made from","reason":"be made of 常用于成品仍能看出原材料或基本保持材料形态的情况，如 a table made of wood；be made from 更强调原料经过加工或变化，如 paper made from wood。实际使用中存在语料差异，关键是看是否强调材料转变，而不是只按中文“由……制成”硬套。"}},{"id":"asset_eng_grammar_preposition_of_b1_extension","knowledgePointId":"eng_grammar_preposition_of_b1","strategy":"EXTENSION","title":"Next learning steps","createdAt":"2026-10-19T16:31:47.7754594+09:00","updatedAt":null,"extension":{"nextTopics":["of-phrases in complex noun phrases","Partitives and measurement phrases","Adjectives and verbs followed by of","Double genitive: a friend of mine","Preposition choice in fixed expressions"]}}],"availableIds":["eng_grammar_preposition_of_b1","eng_expression_fixed_expression_no_matter_what_b1","eng_grammar_article_zero_plural_general_a2","eng_grammar_clause_nominal_what_b1","eng_grammar_conjunction_even_though_b1","eng_grammar_modal_can_a2","eng_grammar_modal_could_a2","eng_grammar_modal_will_future_a2","eng_grammar_modal_would_hypothetical_b1","eng_grammar_negation_dont_a1","eng_grammar_participle_ing_clause_b1","eng_grammar_present_simple_a1","eng_grammar_pronouns_indefinite_a2","eng_grammar_pronouns_subject_object_a1","eng_grammar_question_short_answer_do_a1","eng_pragmatics_speech_act_apology_b1","eng_vocabulary_collocation_make_mistakes_a2","eng_vocabulary_phrase_a_little_bit_a2","eng_vocabulary_word_blame_b1","eng_vocabulary_word_either_negative_b1","eng_vocabulary_word_messy_a2","eng_vocabulary_word_wanna_informal_b1","eng_vocabulary_word_formation_tion_b1","eng_grammar_possession_of_s_b1","eng_grammar_prepositions_at_on_in_b1"],"names":{"eng_grammar_preposition_of_b1":"介词 of 的常见用法","eng_expression_fixed_expression_no_matter_what_b1":"固定表达 no matter + 疑问词","eng_grammar_article_z
